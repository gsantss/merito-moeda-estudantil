<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12344d">
  <meta name="description" content="Sistema de Moeda Estudantil da PUC Minas. Laboratório 3, Sprint 03.">
  <title>{{ titulo }} · Mérito+ | Moeda Estudantil</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
  <script src="{{ url_for('static', path='/js/sprint03.js') }}" defer></script>
</head>
<body data-page="{{ pagina }}">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/" aria-label="Mérito+, página inicial"><span class="brand-mark" aria-hidden="true">✦</span><span>Mérito<span class="brand-plus">+</span><small>MOEDA ESTUDANTIL</small></span></a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="/" class="nav-home">Início</a>
        <a href="/parceiros" class="nav-partners">Parceiros</a>
        <a href="/vantagens" class="nav-catalog">Vantagens</a>
        <a href="/painel" class="nav-panel" hidden>Meu painel</a>
        <a href="/login" class="nav-login btn btn-outline btn-sm">Entrar</a>
        <button type="button" class="nav-logout btn btn-outline btn-sm" hidden>Sair <span aria-hidden="true">↗</span></button>
      </nav>
    </div>
  </header>
  <main id="conteudo">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><div class="wrap footer-inner"><div><strong>✦ Mérito+</strong> <span class="muted">· Projeto acadêmico — PUC Minas</span></div><span>LAB03S03 · Sprint 03 · 2026</span></div></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
