# Infraestrutura do backend no Render, como código (Blueprint).
# No painel do Render: New > Blueprint > escolha este repositório. O Render cria o banco
# PostgreSQL e a API, e liga um ao outro. Passo a passo em docs/IMPLANTACAO.md.

databases:
  - name: merito-db
    plan: free
    region: virginia
    databaseName: moeda_estudantil
    user: merito
    postgresMajorVersion: "16"
    # Sem acesso pela internet: só a API, pela rede interna do Render, acessa o banco.
    ipAllowList: []

services:
  - type: web
    name: merito-moeda-estudantil-api
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    autoDeploy: true
    # Mudanças só na interface (frontend/) ou na documentação não reimplantam a API.
    buildFilter:
      paths:
        - app/**
        - scripts/**
        - requirements.txt
        - render.yaml
        - .python-version
    envVars:
      - key: AMBIENTE
        value: producao
      - key: DATABASE_URL
        fromDatabase:
          name: merito-db
          property: connectionString
      # Segredos gerados pelo próprio Render: não ficam no código nem no repositório.
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_SENHA
        generateValue: true
      - key: SEED_DEMO_PROFESSOR
        value: "1"
      - key: SEED_DEMO_COMPLETO
        value: "1"
      - key: TAREFAS_AUTOMATICAS
        value: "1"
      # E-mail (opcional). Preenchidos no painel do Render; sem SMTP_HOST, as notificações ficam pendentes.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
